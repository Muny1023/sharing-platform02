spring.application.name=notification-service
server.port=8083
spring.config.import=optional:nacos:${spring.application.name}.yaml
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.datasource.url=${NOTIFICATION_DB_URL:jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${NOTIFICATION_DB_USERNAME:root}
spring.datasource.password=${NOTIFICATION_DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.security.jwt.key=${JWT_KEY:abcdefghijk}
spring.cloud.internal.token=${INTERNAL_SERVICE_TOKEN:dev-internal-token}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
mybatis-plus.configuration.map-underscore-to-camel-case=true
