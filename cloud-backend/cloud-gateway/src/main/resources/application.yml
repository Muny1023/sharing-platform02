spring:
  application:
    name: cloud-gateway
  config:
    import: optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:123456}
    gateway:
      server:
        webflux:
          routes:
            - id: account-auth
              uri: lb://account-service
              predicates:
                - Path=/api/auth/**
            - id: account-user
              uri: lb://account-service
              predicates:
                - Path=/api/user/**
            - id: account-seata
              uri: lb://account-service
              predicates:
                - Path=/api/seata/**
            - id: content-post
              uri: lb://content-service
              predicates:
                - Path=/api/post/**
            - id: content-comment
              uri: lb://content-service
              predicates:
                - Path=/api/comment/**
            - id: content-like
              uri: lb://content-service
              predicates:
                - Path=/api/like/**
            - id: content-favorite
              uri: lb://content-service
              predicates:
                - Path=/api/favorite/**
            - id: notification
              uri: lb://notification-service
              predicates:
                - Path=/api/notification/**
            - id: content-ai
              uri: lb://content-service
              predicates:
                - Path=/api/ai/**,/internal/ai/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - http://localhost:5173
                  - http://127.0.0.1:5173
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - '*'
                allow-credentials: true
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR:localhost:8858}
      eager: true
      web-context-unify: false
      datasource:
        gateway-flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:123456}
            data-id: ${SENTINEL_FLOW_DATA_ID:cloud-gateway-flow}
            group-id: ${SENTINEL_FLOW_GROUP_ID:DEFAULT_GROUP}
            rule-type: gw-flow
        gateway-degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:123456}
            data-id: ${SENTINEL_DEGRADE_DATA_ID:cloud-gateway-degrade}
            group-id: ${SENTINEL_DEGRADE_GROUP_ID:DEFAULT_GROUP}
            rule-type: degrade
      scg:
        fallback:
          mode: response
          response-status: 429
          content-type: 'application/json;charset=UTF-8'
          response-body: '{"code":429,"data":null,"message":"请求量过大，请稍后重试"}'
server:
  port: 8080
