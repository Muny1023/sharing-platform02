spring:
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - http://localhost:5173
                  - http://127.0.0.1:5173
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - '*'
                allowCredentials: true
    sentinel:
      scg:
        fallback:
          mode: response
          response-status: 429
          content-type: 'application/json;charset=UTF-8'
          response-body: '{"code":429,"data":null,"message":"请求量过大，请稍后重试"}'
