spring.application.name=cloud-gateway
server.port=8080
spring.config.import=optional:nacos:${spring.application.name}.yaml
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.gateway.server.webflux.routes[0].id=account-auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://account-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webflux.routes[1].id=account-user
spring.cloud.gateway.server.webflux.routes[1].uri=lb://account-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/user/**
spring.cloud.gateway.server.webflux.routes[2].id=account-seata
spring.cloud.gateway.server.webflux.routes[2].uri=lb://account-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/seata/**
spring.cloud.gateway.server.webflux.routes[3].id=content-post
spring.cloud.gateway.server.webflux.routes[3].uri=lb://content-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/post/**
spring.cloud.gateway.server.webflux.routes[4].id=content-comment
spring.cloud.gateway.server.webflux.routes[4].uri=lb://content-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/comment/**
spring.cloud.gateway.server.webflux.routes[5].id=content-like
spring.cloud.gateway.server.webflux.routes[5].uri=lb://content-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/like/**
spring.cloud.gateway.server.webflux.routes[6].id=content-favorite
spring.cloud.gateway.server.webflux.routes[6].uri=lb://content-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/favorite/**
spring.cloud.gateway.server.webflux.routes[7].id=notification
spring.cloud.gateway.server.webflux.routes[7].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/notification/**
spring.cloud.gateway.server.webflux.routes[8].id=content-ai
spring.cloud.gateway.server.webflux.routes[8].uri=lb://content-service
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/ai/**,/internal/ai/**
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.sentinel.transport.dashboard=${SENTINEL_DASHBOARD_ADDR:localhost:8858}
spring.cloud.sentinel.eager=true
spring.cloud.sentinel.web-context-unify=false
spring.cloud.sentinel.datasource.gateway-flow.nacos.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.sentinel.datasource.gateway-flow.nacos.username=${NACOS_USERNAME:nacos}
spring.cloud.sentinel.datasource.gateway-flow.nacos.password=${NACOS_PASSWORD:nacos}
spring.cloud.sentinel.datasource.gateway-flow.nacos.data-id=${SENTINEL_FLOW_DATA_ID:cloud-gateway-flow}
spring.cloud.sentinel.datasource.gateway-flow.nacos.group-id=${SENTINEL_FLOW_GROUP_ID:DEFAULT_GROUP}
spring.cloud.sentinel.datasource.gateway-flow.nacos.rule-type=gw-flow
spring.cloud.sentinel.datasource.gateway-degrade.nacos.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.sentinel.datasource.gateway-degrade.nacos.username=${NACOS_USERNAME:nacos}
spring.cloud.sentinel.datasource.gateway-degrade.nacos.password=${NACOS_PASSWORD:nacos}
spring.cloud.sentinel.datasource.gateway-degrade.nacos.data-id=${SENTINEL_DEGRADE_DATA_ID:cloud-gateway-degrade}
spring.cloud.sentinel.datasource.gateway-degrade.nacos.group-id=${SENTINEL_DEGRADE_GROUP_ID:DEFAULT_GROUP}
spring.cloud.sentinel.datasource.gateway-degrade.nacos.rule-type=degrade
spring.cloud.sentinel.scg.fallback.mode=response
spring.cloud.sentinel.scg.fallback.response-status=429
spring.cloud.sentinel.scg.fallback.content-type=application/json;charset=UTF-8
spring.cloud.sentinel.scg.fallback.response-body={"code":429,"data":null,"message":"请求过于频繁，请稍后再试"}
