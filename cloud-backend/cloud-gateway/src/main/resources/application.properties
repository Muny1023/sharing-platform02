spring.application.name=cloud-gateway
server.port=8080
spring.config.import=optional:nacos:${spring.application.name}.yaml
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.gateway.routes[0].id=account-auth
spring.cloud.gateway.routes[0].uri=lb://account-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[1].id=account-user
spring.cloud.gateway.routes[1].uri=lb://account-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/user/**
spring.cloud.gateway.routes[2].id=content-post
spring.cloud.gateway.routes[2].uri=lb://content-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/post/**
spring.cloud.gateway.routes[3].id=content-comment
spring.cloud.gateway.routes[3].uri=lb://content-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/comment/**
spring.cloud.gateway.routes[4].id=content-like
spring.cloud.gateway.routes[4].uri=lb://content-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/like/**
spring.cloud.gateway.routes[5].id=content-favorite
spring.cloud.gateway.routes[5].uri=lb://content-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/favorite/**
spring.cloud.gateway.routes[6].id=notification
spring.cloud.gateway.routes[6].uri=lb://notification-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/notification/**
