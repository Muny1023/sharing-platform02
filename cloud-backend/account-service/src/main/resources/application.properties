spring.application.name=account-service
server.port=8081
spring.config.import=optional:nacos:${spring.application.name}.yaml
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.datasource.url=${ACCOUNT_DB_URL:jdbc:mysql://localhost:3306/test?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${ACCOUNT_DB_USERNAME:root}
spring.datasource.password=${ACCOUNT_DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:admin}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.security.jwt.key=${JWT_KEY:abcdefghijk}
spring.security.jwt.expire=${JWT_EXPIRE_DAYS:7}
mybatis-plus.configuration.map-underscore-to-camel-case=true
